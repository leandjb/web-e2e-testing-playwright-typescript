# Docker Compose runner for the Playwright E2E suite.
# The project is mounted at /tests and ALL dependencies are installed inside the
# container (corepack + pnpm). Nothing is installed on the host.
# Override the default command via `docker compose run --rm e2e bash -c "..."`
# (see run-e2e.sh) to pass shard index / grep flags.

services:
  e2e:
    image: mcr.microsoft.com/playwright:v1.62.0-noble
    working_dir: /tests
    profiles: ["e2e"]
    # Default command (run-e2e.sh overrides this per shard). Runs the full suite
    # on shard SHARD_INDEX/TOTAL_SHARDS.
    command: bash -c "corepack enable && pnpm install --frozen-lockfile && pnpm exec playwright test --shard=${SHARD_INDEX:-1}/${TOTAL_SHARDS:-2}"
    environment:
      BASE_URL: ${BASE_URL:-https://www.saucedemo.com}
      TOTAL_SHARDS: ${TOTAL_SHARDS:-2}
      SHARD_INDEX: ${SHARD_INDEX:-1}
      TEST_MODE: ${TEST_MODE:-full}
      SAUCEDEMO_PASSWORD: ${SAUCEDEMO_PASSWORD}
      SAUCEDEMO_USER_STANDARD: ${SAUCEDEMO_USER_STANDARD:-standard_user}
      SAUCEDEMO_USER_LOCKED: ${SAUCEDEMO_USER_LOCKED:-locked_out_user}
      SAUCEDEMO_USER_PROBLEM: ${SAUCEDEMO_USER_PROBLEM:-problem_user}
      SAUCEDEMO_USER_PERFORMANCE: ${SAUCEDEMO_USER_PERFORMANCE:-performance_glitch_user}
      SAUCEDEMO_USER_ERROR: ${SAUCEDEMO_USER_ERROR:-error_user}
      SAUCEDEMO_USER_VISUAL: ${SAUCEDEMO_USER_VISUAL:-visual_user}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    volumes:
      - ./:/tests
      - /tests/node_modules
      # Bind-mounted (not a named volume) so the per-shard blob reports land on
      # the host and can be shared between local parallel shards AND uploaded /
      # re-mounted by the CI merge job.
      - ./blob-report:/tests/blob-report
      - ./backups:/tests/backups
      - ./.auth:/tests/.auth
    # Hardening so a stuck run cannot hang the container or exhaust the host.
    shm_size: 2gb
    ipc: host
    init: true
    pids_limit: 512
    mem_limit: 2g
    stop_grace_period: 30s

  # Merge service: combines per-shard blob reports into a single HTML report.
  # Only invoked by run-e2e.sh / CI after the shard jobs complete.
  merge:
    image: mcr.microsoft.com/playwright:v1.62.0-noble
    working_dir: /tests
    profiles: ["merge"]
    command: bash -c "corepack enable && pnpm install --frozen-lockfile && pnpm exec playwright merge-reports --reporter html blob-report && rm -rf backups/report && cp -r playwright-report backups/report"
    environment:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    volumes:
      - ./:/tests
      - /tests/node_modules
      - ./blob-report:/tests/blob-report
      - ./backups:/tests/backups
